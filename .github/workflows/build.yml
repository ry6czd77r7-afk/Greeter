name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/owais/greeter
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OwaisGreeter"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.owais.greeter'
            compileSdk 34
            defaultConfig {
              applicationId "com.owais.greeter"
              minSdk 24
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <application android:label="Owais Greeter">
              <activity android:name=".MainActivity" android:exported="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                </intent-filter>
              </receiver>
              <service android:name=".GreetService" android:exported="false"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/owais/greeter/MainActivity.java <<'EOF'
          package com.owais.greeter;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          public class MainActivity extends Activity {
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              Intent i = new Intent(this, GreetService.class);
              i.putExtra("delay", 0L);
              startForegroundService(i);
              finish();
            }
          }
          EOF
          cat > app/src/main/java/com/owais/greeter/BootReceiver.java <<'EOF'
          package com.owais.greeter;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent in) {
              Intent i = new Intent(c, GreetService.class);
              i.putExtra("delay", 15000L);
              c.startForegroundService(i);
            }
          }
          EOF
          cat > app/src/main/java/com/owais/greeter/GreetService.java <<'EOF'
          package com.owais.greeter;
          import android.app.*;
          import android.content.Intent;
          import android.os.*;
          import android.speech.tts.*;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class GreetService extends Service {
            private TextToSpeech tts;
            private final Handler h = new Handler(Looper.getMainLooper());
            @Override public IBinder onBind(Intent i) { return null; }
            @Override public int onStartCommand(Intent in, int f, int id) {
              NotificationChannel ch = new NotificationChannel("g", "Greeting", NotificationManager.IMPORTANCE_LOW);
              getSystemService(NotificationManager.class).createNotificationChannel(ch);
              Notification n = new Notification.Builder(this, "g")
                .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                .setContentTitle("Greeting").build();
              startForeground(1, n);
              long delay = in == null ? 0L : in.getLongExtra("delay", 0L);
              h.postDelayed(this::speak, delay);
              h.postDelayed(this::stopSelf, delay + 40000);
              return START_NOT_STICKY;
            }
            private void speak() {
              tts = new TextToSpeech(this, status -> {
                if (status != TextToSpeech.SUCCESS) { stopSelf(); return; }
                tts.setLanguage(Locale.US);
                int hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
                String part = hr < 12 ? "morning" : (hr < 17 ? "afternoon" : "evening");
                String time = new SimpleDateFormat("h:mm a", Locale.US).format(new Date());
                String text = "Hello Owais. It is " + time + ". Good " + part + " Owais.";
                tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                  public void onStart(String s) {}
                  public void onDone(String s) { stopSelf(); }
                  public void onError(String s) { stopSelf(); }
                });
                tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "g");
              });
            }
            @Override public void onDestroy() {
              if (tts != null) tts.shutdown();
              super.onDestroy();
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: owais-greeter
          path: app/build/outputs/apk/debug/app-debug.apk
